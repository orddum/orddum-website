name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORDDUM }}
          projectId: orddum
          # Fixo: a 15.34.1 passou a consultar o serviceusage, que a conta de deploy não pode
          # ler, e o deploy quebrou com 403 (22/10/2026). Suba de versão de propósito, não sozinho.
          firebaseToolsVersion: 15.34.0
