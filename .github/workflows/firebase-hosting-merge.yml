# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORDDUM }}
          channelId: live
          projectId: orddum
          # Fixo: a 15.34.1 passou a consultar o serviceusage, que a conta de deploy não pode
          # ler, e o deploy quebrou com 403 (22/10/2026). Suba de versão de propósito, não sozinho.
          firebaseToolsVersion: 15.34.0
